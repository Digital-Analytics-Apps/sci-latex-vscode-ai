services:
  postgres:
    image: postgres:16-alpine
    container_name: sci_latex_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sci_latex_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sci_latex_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: sci_latex_pgbouncer
    restart: always
    ports:
      - "6543:5432"
    environment:
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: "*"
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      ADMIN_USERS: postgres
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 25
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 5
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: sci_latex_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
  minio:
    image: cleanstart/minio:latest
    container_name: sci_latex_minio
    user: "0:0"
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  compiler:
    build:
      context: ./compiler
    container_name: sci_latex_compiler
    restart: always
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      HOST: "0.0.0.0"

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: sci_latex_ai_service
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./ai-service/.env
    environment:
      ENVIRONMENT: development
      HOST: "0.0.0.0"
      PORT: 8000
      BACKEND_API_URL: http://backend:3333
      REDIS_URL: redis://redis:6379
      INTERNAL_SERVICE_KEY: scia-internal-secret-change-in-production
      JWT_SECRET: super-secret-jwt-key-change-in-production
      OPIK_URL_OVERRIDE: http://host.docker.internal:5174/api
    volumes:
      - ./ai-service:/app
      - /app/.venv
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sci_latex_backend
    restart: always
    ports:
      - "3333:3333"
      - "9229:9229" # Porta para depuração do Node.js
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/sci_latex_db?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: super-secret-jwt-key-change-in-production
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET: collab-assets
      COMPILER_URL: http://compiler:4000
      AI_SERVICE_URL: http://ai-service:8000
      PROMETHEUS_URL: http://host.docker.internal:9090
      LOKI_URL: http://host.docker.internal:3100
      OPIK_URL: http://host.docker.internal:8081
      GLITCHTIP_URL: http://host.docker.internal:8005
      INTERNAL_SERVICE_KEY: scia-internal-secret-change-in-production
      PORT: 3333
      HOST: "::"
      NODE_ENV: development
    volumes:
      - ./backend:/app
      - ./storage:/app/storage
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      compiler:
        condition: service_started
      ai-service:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: sh -c "npx prisma generate && exec npm run dev"
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sci_latex_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3333/api/v1
      VITE_WS_URL: ws://localhost:3333
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
  minio_data:
