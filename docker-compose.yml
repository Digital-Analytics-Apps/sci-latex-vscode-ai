version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sci_latex_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sci_latex_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sci_latex_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sci_latex_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
  minio:
    image: cleanstart/minio:latest
    container_name: sci_latex_minio
    user: "0:0"
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  compiler:
    build:
      context: ./compiler
    container_name: sci_latex_compiler
    restart: always
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      HOST: "0.0.0.0"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sci_latex_backend
    restart: always
    ports:
      - "3333:3333"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/sci_latex_db?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: super-secret-jwt-key-change-in-production
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET: collab-assets
      COMPILER_URL: http://compiler:4000
      PORT: 3333
      HOST: "::"
      NODE_ENV: development
    volumes:
      - ./backend:/app
      - ./storage:/app/storage
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      compiler:
        condition: service_started
    command: sh -c "npx prisma generate && exec npm run dev"
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sci_latex_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3333/api/v1
      VITE_WS_URL: ws://localhost:3333
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
  minio_data:
