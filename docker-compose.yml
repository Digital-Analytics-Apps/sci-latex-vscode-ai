version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sci_latex_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sci_latex_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sci_latex_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: sci_latex_rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sci_latex_backend
    restart: always
    ports:
      - "3333:3333"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/sci_latex_db?schema=public
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      JWT_SECRET: super-secret-jwt-key-change-in-production
      GIT_SERVICE_TOKEN: system-git-service-token-secret
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_ORG: ${GITHUB_ORG:-}
      GITHUB_REPO_PREFIX: ${GITHUB_REPO_PREFIX:-sci-paper-}
      CODE_SERVER_URL: http://code-server:8080
      PORT: 3333
      HOST: 0.0.0.0
      NODE_ENV: development
    volumes:
      - ./backend:/app
      - ./storage:/app/storage
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: npm run dev

  code-server:
    image: codercom/code-server:latest
    container_name: sci_latex_codeserver
    restart: always
    ports:
      - "8080:8080"
    environment:
      PASSWORD: "sci-latex-code-server-secret"
    volumes:
      - ./storage:/home/coder/storage
    command: --auth none --disable-telemetry /home/coder/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sci_latex_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3333/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
      - code-server
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:

