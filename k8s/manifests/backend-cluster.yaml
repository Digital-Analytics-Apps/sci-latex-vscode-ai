apiVersion: apps/v1
kind: Deployment
metadata:
  name: sci-latex-backend
  namespace: default
  labels:
    app: sci-latex-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sci-latex-backend
  template:
    metadata:
      labels:
        app: sci-latex-backend
    spec:
      containers:
        - name: backend
          image: sci-latex-backend:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: sci-latex-secret
          env:
            - name: PORT
              value: "3333"
            - name: HOST
              value: "0.0.0.0"
            - name: NODE_ENV
              value: "production"
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: MINIO_ENDPOINT
              value: "http://minio:9000"
            - name: MINIO_BUCKET
              value: "collab-assets"
            - name: COMPILER_URL
              value: "http://compiler:4000"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - containerPort: 3333
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 150Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3333
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3333
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: sci-latex-backend-service
  namespace: default
  labels:
    app: sci-latex-backend
spec:
  type: NodePort
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  selector:
    app: sci-latex-backend
  ports:
    - port: 3333
      targetPort: 3333
      nodePort: 30080
      name: http-ws
