apiVersion: v1
kind: Secret
metadata:
  name: sci-latex-secret
  namespace: default
  labels:
    app.kubernetes.io/name: sci-latex-secret
    app.kubernetes.io/part-of: sci-latex-stack
type: Opaque
stringData:
  # =====================================================================
  # TEMPLATE DE SEGREDOS - NÃO COMMITAR CREDENCIAIS REAIS NO GIT
  # Copie este arquivo para secret.yaml (ignorado pelo git) e aplique:
  #   kubectl apply -f k8s/manifests/secret.yaml
  # =====================================================================
  DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/sci_latex_db?schema=public"
  JWT_SECRET: "your-super-secret-jwt-key-min-32-chars"
  MINIO_ACCESS_KEY: "minioadmin"
  MINIO_SECRET_KEY: "minioadmin123"
  VITE_API_URL: "http://localhost:30080/api/v1"
  VITE_WS_URL: "ws://localhost:30080"
