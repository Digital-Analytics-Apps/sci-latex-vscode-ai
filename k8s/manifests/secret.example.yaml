# ==============================================================================
# TEMPLATE DE SEGREDOS DO KUBERNETES (Secret)
# O que é um Secret?
# É um objeto nativo do Kubernetes projetado para armazenar credenciais confidenciais
# (senhas de banco, chaves privadas JWT, tokens de API).
#
# REGRA DE OURO DE SEGURANÇA:
# NUNCA commite o arquivo com as senhas reais no Git!
# 1. Copie este arquivo para 'secret.yaml' (já está no .gitignore)
# 2. Preencha com as senhas reais do seu ambiente
# 3. Aplique diretamente no cluster: kubectl apply -f k8s/manifests/secret.yaml
# ==============================================================================

apiVersion: v1
kind: Secret
metadata:
  # Nome do secret que o 'envFrom.secretRef' do Deployment procura
  name: sci-latex-secret
  namespace: default
  labels:
    app.kubernetes.io/name: sci-latex-secret
    app.kubernetes.io/part-of: sci-latex-stack

# 'Opaque' é o tipo padrão para pares arbitrários de chave-valor secretos
type: Opaque

# 'stringData' permite escrever texto puro (Plain Text) no arquivo YAML;
# O próprio Kubernetes converte automaticamente para Base64 quando salva no etcd!
stringData:
  # URL de conexão com o banco de dados PostgreSQL
  DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/sci_latex_db?schema=public"

  # Chave secreta de alta entropia para assinar e validar tokens JWT de autenticação
  JWT_SECRET: "your-super-secret-jwt-key-min-32-chars"

  # Chave de acesso administrativo do armazenamento S3 MinIO
  MINIO_ACCESS_KEY: "minioadmin"

  # Senha secreta de acesso ao armazenamento S3 MinIO
  MINIO_SECRET_KEY: "minioadmin123"

  # Chave de segurança Machine-to-Machine para comunicação inter-serviços (ADR-012)
  INTERNAL_SERVICE_KEY: "scia-internal-secret-change-in-production"

  # URL da API REST consumida pelo navegador no Frontend
  VITE_API_URL: "http://localhost:30080/api/v1"

  # URL do WebSocket consumida pelo editor colaborativo no Frontend
  VITE_WS_URL: "ws://localhost:30080"
