apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-project-template
  namespace: default
  labels:
    app.kubernetes.io/part-of: sci-latex-vscode
    component: project-storage
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: code-server-service
  namespace: default
  labels:
    app.kubernetes.io/part-of: sci-latex-vscode
    component: code-server
spec:
  type: NodePort
  selector:
    component: code-server
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
---
apiVersion: v1
kind: Pod
metadata:
  name: workspace-warm-standby-template
  namespace: default
  labels:
    app.kubernetes.io/part-of: sci-latex-vscode
    component: code-server
    role: warm-standby
spec:
  containers:
    - name: code-server
      image: sci-latex-vscode-code-server:latest
      imagePullPolicy: IfNotPresent
      args:
        - "--auth"
        - "none"
        - "--disable-telemetry"
        - "--disable-workspace-trust"
        - "/home/coder/storage"
      ports:
        - containerPort: 8080
          name: http
      volumeMounts:
        - name: host-storage
          mountPath: /home/coder/storage
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 1000m
          memory: 1Gi
  volumes:
    - name: host-storage
      hostPath:
        path: /home/coder/storage

