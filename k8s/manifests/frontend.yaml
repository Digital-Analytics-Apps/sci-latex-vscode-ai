apiVersion: apps/v1
kind: Deployment
metadata:
  name: sci-latex-frontend
  namespace: default
  labels:
    app: sci-latex-frontend
    app.kubernetes.io/name: sci-latex-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sci-latex-frontend
  template:
    metadata:
      labels:
        app: sci-latex-frontend
    spec:
      containers:
        - name: frontend
          image: sci-latex-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: sci-latex-frontend-service
  namespace: default
  labels:
    app: sci-latex-frontend
    app.kubernetes.io/name: sci-latex-frontend
spec:
  type: ClusterIP
  selector:
    app: sci-latex-frontend
  ports:
    - port: 80
      targetPort: 80
      name: http
