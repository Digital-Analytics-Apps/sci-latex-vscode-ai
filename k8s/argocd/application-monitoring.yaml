apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: scia-monitoring-stack
  namespace: argocd
  labels:
    app.kubernetes.io/name: scia-monitoring-stack
    app.kubernetes.io/part-of: sci-latex-stack
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://prometheus-community.github.io/helm-charts'
    chart: kube-prometheus-stack
    targetRevision: 61.9.0
    helm:
      valueFiles:
        - '$values/k8s/monitoring/values-kube-prometheus-stack.yaml'
  sources:
    - repoURL: 'https://prometheus-community.github.io/helm-charts'
      chart: kube-prometheus-stack
      targetRevision: 61.9.0
      helm:
        values: |
          prometheus:
            prometheusSpec:
              serviceMonitorSelectorNilUsesHelmValues: false
    - repoURL: 'https://github.com/Digital-Analytics-Apps/sci-latex-vscode-ai.git'
      targetRevision: dev
      ref: values
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
