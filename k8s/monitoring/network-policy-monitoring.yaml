apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-scraping
  namespace: default
  labels:
    app.kubernetes.io/part-of: sci-latex-stack
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["sci-latex-backend", "sci-latex-ai-service", "sci-latex-compiler"]
  policyTypes:
    - Ingress
  ingress:
    # 1. Permite tráfego normal dentro do próprio namespace da aplicação (Backend <-> Compiler <-> DB)
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 3333
        - protocol: TCP
          port: 4000
        - protocol: TCP
          port: 8000

    # 2. Permite tráfego cross-namespace estritamente originado pelo namespace 'monitoring' (Prometheus)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 3333
        - protocol: TCP
          port: 4000
        - protocol: TCP
          port: 8000
