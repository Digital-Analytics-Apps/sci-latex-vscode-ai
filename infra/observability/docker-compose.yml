version: '3.8'

services:
  # ============================================================================
  # 1. VISUALIZAÇÃO & MÉTRICAS PRINCIPAIS
  # ============================================================================
  # Painel Visual Centralizador (Grafana)
  grafana:
    image: grafana/grafana:11.2.0
    container_name: scia_grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin_scia_local}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - scia-network

  # Séries Temporais de Métricas (Prometheus)
  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: scia_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - scia-network

  # Ingestão de Logs (Loki)
  loki:
    image: grafana/loki:3.1.1
    container_name: scia_loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - scia-network

  # Agente Unificado de Coleta de Logs (Grafana Alloy)
  alloy:
    image: grafana/alloy:v1.3.0
    container_name: scia_alloy
    restart: unless-stopped
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log:/var/log:ro
    ports:
      - "12345:12345"
    depends_on:
      - loki
    networks:
      - scia-network

  # OpenTelemetry Collector com Tail-Sampling
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    container_name: scia_otel_collector
    restart: unless-stopped
    command: [ "--config=/etc/otelcol-config.yaml" ]
    volumes:
      - ./otelcol-config.yaml:/etc/otelcol-config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "8889:8889" # Prometheus metrics exporter
    depends_on:
      - tempo
    networks:
      - scia-network

  # Tracing Distribuído (Tempo)
  tempo:
    image: grafana/tempo:2.5.0
    container_name: scia_tempo
    restart: unless-stopped
    command: [ "-config.file=/etc/tempo.yaml" ]
    ports:
      - "3200:3200"
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    networks:
      - scia-network

  # ============================================================================
  # 2. LLMOPS: STACK NATIVA DO OPIK (Comet - Apache 2.0)
  # Rastreia tokens, custos, latência TTFT e nós LangGraph do ai-service
  # ============================================================================
  opik-mysql:
    image: mysql:8.0
    container_name: scia_opik_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${OPIK_MYSQL_ROOT_PASSWORD:-opikroot}
      MYSQL_DATABASE: ${OPIK_MYSQL_DATABASE:-opik}
      MYSQL_USER: ${OPIK_MYSQL_USER:-opik}
      MYSQL_PASSWORD: ${OPIK_MYSQL_PASSWORD:-opikpassword}
    volumes:
      - opik_mysql_data:/var/lib/mysql
    networks:
      - scia-network

  opik-clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: scia_opik_clickhouse
    restart: unless-stopped
    volumes:
      - opik_ch_data:/var/lib/clickhouse
    networks:
      - scia-network

  opik:
    image: cometml/opik:latest
    container_name: scia_opik
    restart: unless-stopped
    depends_on:
      - opik-mysql
      - opik-clickhouse
    ports:
      - "5174:5173" # Interface Web do Opik
      - "8081:8080" # API Backend de Ingestão de Traces de IA
    environment:
      MYSQL_URL: jdbc:mysql://opik-mysql:3306/${OPIK_MYSQL_DATABASE:-opik}?user=${OPIK_MYSQL_USER:-opik}&password=${OPIK_MYSQL_PASSWORD:-opikpassword}
      CLICKHOUSE_URL: jdbc:clickhouse://opik-clickhouse:8123/default
    networks:
      - scia-network

  # ============================================================================
  # 3. GESTÃO DE EXCEÇÕES: GLITCHTIP (Compatível com Sentry SDK)
  # Captura falhas não tratadas no React e nos microsserviços
  # ============================================================================
  glitchtip-web:
    image: glitchtip/glitchtip:latest
    container_name: scia_glitchtip_web
    restart: unless-stopped
    ports:
      - "8005:8000"
    environment:
      DATABASE_URL: ${GLITCHTIP_DATABASE_URL:-postgresql://postgres:postgres@host.docker.internal:5432/sci_latex_db?schema=glitchtip}
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-scia-glitchtip-secret-change-in-production}
      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:-http://localhost:8005}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - scia-network

  glitchtip-worker:
    image: glitchtip/glitchtip:latest
    container_name: scia_glitchtip_worker
    restart: unless-stopped
    command: ./bin/run-celery-with-beat.sh
    environment:
      DATABASE_URL: ${GLITCHTIP_DATABASE_URL:-postgresql://postgres:postgres@host.docker.internal:5432/sci_latex_db?schema=glitchtip}
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-scia-glitchtip-secret-change-in-production}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - scia-network

volumes:
  grafana_data:
  prometheus_data:
  loki_data:
  tempo_data:
  opik_mysql_data:
  opik_ch_data:

networks:
  scia-network:
    name: scia-network
    driver: bridge
