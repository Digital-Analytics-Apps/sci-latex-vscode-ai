global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: 'scia-backend'
    metrics_path: '/metrics'
    scrape_interval: 10s
    static_configs:
      - targets: ['backend:3333', 'host.docker.internal:3333']
    metric_relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'scia-backend'

  - job_name: 'scia-ai-service'
    metrics_path: '/metrics'
    scrape_interval: 10s
    static_configs:
      - targets: ['ai-service:8000', 'host.docker.internal:8000']
    metric_relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'scia-ai-service'

  - job_name: 'scia-compiler'
    metrics_path: '/metrics'
    scrape_interval: 10s
    static_configs:
      - targets: ['compiler:4000', 'host.docker.internal:4000']
    metric_relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'scia-compiler'
